<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- configuração padrão do HTML -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Bigod's</title>
    <!-- logo na aba do navegador (favicon) -->
    <link rel="icon" sizes="16x16" href="../assets/favicon-16x16.png">
    <link rel="icon" sizes="32x32" href="../assets/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
    <link rel="icon" sizes="192x192" href="../assets/android-chrome-192x192.png">
    <link rel="icon" sizes="512x512" href="../assets/android-chrome-512x512.png">
    <!-- importação de fontes (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
    <!-- importação dos ícones (bootstrap) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- link redirecionado para o CSS externo -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- section 1 - cabeçalho principal do header -->
    <div class="background-parallax">
        <header class="headerzinho">
            <div class="barbearialogo">
                <a href="../home/index.html">
                    <img src="../assets/blogo2.png" alt="Logo da barbearia" width="80">
                </a>
            </div>
            <!-- titulo e subtitulo do header -->
            <div class="titulos-header">
                <h1 class="titulo-header">Barbearia Bigod's</h1>
            </div>
            <!-- section central (seções do menu) -->
            <div class="central-section">
                <button><a href="#">PROFISSIONAIS</a></button>
                <hr class="divisoria-central-section">
                <button><a href="#">SERVIÇOS</a></button>
                <hr class="divisoria-central-section">
                <button><a href="#">PRODUTOS</a></button>
                <hr class="divsoria-central-section">
                <button><a href="#">CONTATE-NOS</a></button>
            </div>
            <!-- menu superior direito -->
            <nav class="menu">
                <a href="#" aria-label="Carrinho" class="bi bi-cart" alt="Carrinho"></a>
                <a href="#" aria-label="Configurações" class="bi bi-gear" alt="Configurações"></a>
                <a href="#" aria-label="Menu" class="bi bi-list" alt="Menu"></a> <!-- menu dropdown (coluna)-->
            </nav>
            <hr class="divsoria-header">
        </header>
        <!-- conteúdo principal -->
        <main>
            <!-- section 2 (menu principal|home) -->
                <h1 class="h1-omelhor">O melhor corte visual da <span class="h1-cidade">cidade</class></h1>
                <p class="paragrafo1">Você em sua melhor visão</p>
                <button class="botao-agendar">Agendar Corte</button>
                <button class="botao-servicos">Nossos Serviços</button>
        </main>
    </div>
</body>
</html>
